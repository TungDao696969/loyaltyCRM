name: loyalty_crm_project

services:
  postgres_db:
    image: postgres:17
    environment:
      POSTGRES_USER: "f8"
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: loyalty_crm
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis
    ports:
      - "6380:6379"

  backend:
    build:
      context: ./backend # Sửa lại chữ thường cho đúng với thư mục hiện tại
    container_name: loyalty-backend
    restart: always
    ports:
      - "5000:5000" # Project đang chạy port 5000
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://f8:123456@postgres_db:5432/loyalty_crm?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=5000
    depends_on:
      - postgres_db
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    container_name: loyalty-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_db:
